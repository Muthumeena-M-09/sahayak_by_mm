services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahayak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sahayak
    ports:
      - "5432:5432"
    volumes:
      - sahayak_pgdata:/var/lib/postgresql/data

volumes:
  sahayak_pgdata:

